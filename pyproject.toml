[project]
name = "freecad-mcp"
version = "0.1.26"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.28.1,<3",
    "validators>=0.34.0",
]

[project.optional-dependencies]
# MP4 encoding for render_frames / encode_video (bundled ffmpeg binary)
video = ["imageio-ffmpeg>=0.5"]
# PDF -> PNG review images for the TechDraw export tools
drawings = ["pymupdf>=1.24"]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.5",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
